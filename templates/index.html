<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alzheimer Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h1 class="text-center mb-4">Alzheimer Disease Prediction</h1>

        <div class="card p-4 shadow-sm">
            <form action="/predict" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="file" class="form-label">Upload Image</label>
                    <input type="file" name="file" id="file" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Upload and Predict</button>
            </form>

            {% if result %}
            <div class="mt-4 text-center">
            <h2 class="text-success">Prediction: {{ result.class }}</h2>
            <p><strong>Confidence:</strong> {{ result.confidence }}</p>
            <img src="{{ url_for('static', filename=result.filepath) }}"
            alt="Uploaded Image" width="300" class="img-thumbnail mt-2">
            </div>
            {% endif %}

        </div>
    </div>

    <!-- Bootstrap JS (optional, for future use) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
